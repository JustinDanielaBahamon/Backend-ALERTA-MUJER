services:
  postgres:
    image: postgres:16
    container_name: alerta-mujer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerta_mujer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta_mujer_2026}
      POSTGRES_DB: ${POSTGRES_DB:-alerta_mujer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alerta_mujer} -d ${POSTGRES_DB:-alerta_mujer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-monolith
    container_name: alerta-mujer-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerta_mujer}
      - POSTGRES_USER=${POSTGRES_USER:-alerta_mujer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-alerta_mujer_2026}
      - JWT_SECRET=${JWT_SECRET:-alerta_mujer_jwt_secret_key_2026_xK9mP2qR5sT8uV1wX4yZ7}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
