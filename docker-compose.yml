services:
  postgres:
    image: postgres:16
    container_name: alerta-mujer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerta_mujer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alerta_mujer_2026}
      POSTGRES_DB: ${POSTGRES_DB:-alerta_mujer}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alerta_mujer} -d ${POSTGRES_DB:-alerta_mujer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend-monolith
    container_name: alerta-mujer-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerta_mujer}
      # El backend se conecta con un usuario sin privilegios (solo DML), creado por Liquibase
      - POSTGRES_USER=alerta_app
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      # Liquibase (migraciones/DDL) sigue usando el usuario dueño de la base
      - LIQUIBASE_USER=${POSTGRES_USER:-alerta_mujer}
      - LIQUIBASE_PASSWORD=${POSTGRES_PASSWORD:-alerta_mujer_2026}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env (aleatorio, 32+ caracteres)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-86400000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:*,http://127.0.0.1:*}
      - FIREBASE_CONFIG_PATH=/app/firebase-service-account.json
      - EVIDENCE_STORAGE_DIR=/data/evidence
      # Evidencias en S3 como en producción (Backblaze B2); en local, el servicio s3 de abajo
      - EVIDENCE_STORAGE=${EVIDENCE_STORAGE:-s3}
      - EVIDENCE_S3_ENDPOINT=${EVIDENCE_S3_ENDPOINT:-http://s3:8333}
      - EVIDENCE_S3_PUBLIC_ENDPOINT=${EVIDENCE_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - EVIDENCE_S3_REGION=${EVIDENCE_S3_REGION:-us-east-1}
      - EVIDENCE_S3_BUCKET=${EVIDENCE_S3_BUCKET:-alerta-mujer-evidencias}
      - EVIDENCE_S3_ACCESS_KEY=${EVIDENCE_S3_ACCESS_KEY:-alerta_s3_local}
      - EVIDENCE_S3_SECRET_KEY=${EVIDENCE_S3_SECRET_KEY:-alerta_s3_local_secret}
      - EVIDENCE_S3_CREATE_BUCKET=true
      # Correo a los contactos de una alerta (resend | brevo | log). La clave va en .env, nunca aquí.
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-log}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:4200}
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro
      - evidence_data:/data/evidence

  # Almacenamiento S3 local para las evidencias (en producción: Backblaze B2). Solo en este equipo:
  # las claves de docker/seaweedfs/s3.json son de desarrollo. (MinIO ya no publica imágenes libres.)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: alerta-mujer-s3
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"   # API S3
    volumes:
      - s3_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Microservicios (docker compose --profile micro up) ─────────────
  auth-service:
    profiles: [micro]
    build:
      context: ./microservicios
      dockerfile: auth-service/Dockerfile
    container_name: alerta-mujer-auth
    ports:
      - "8081:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerta_mujer}
      - POSTGRES_USER=alerta_app
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env (aleatorio, 32+ caracteres)}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:*,http://127.0.0.1:*}
      - FIREBASE_CONFIG_PATH=/app/firebase-service-account.json
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-clave-interna-solo-local}
      - SERVICES_AUTH_URL=http://auth-service:8080
      - SERVICES_ALERT_URL=http://alert-service:8080
      - SERVICES_EVIDENCE_URL=http://evidence-service:8080
      - PORT=8080
      - LIQUIBASE_USER=${POSTGRES_USER:-alerta_mujer}
      - LIQUIBASE_PASSWORD=${POSTGRES_PASSWORD:-alerta_mujer_2026}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro

  alert-service:
    profiles: [micro]
    build:
      context: ./microservicios
      dockerfile: alert-service/Dockerfile
    container_name: alerta-mujer-alert
    ports:
      - "8082:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerta_mujer}
      - POSTGRES_USER=alerta_app
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env (aleatorio, 32+ caracteres)}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:*,http://127.0.0.1:*}
      - FIREBASE_CONFIG_PATH=/app/firebase-service-account.json
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-clave-interna-solo-local}
      - SERVICES_AUTH_URL=http://auth-service:8080
      - SERVICES_ALERT_URL=http://alert-service:8080
      - SERVICES_EVIDENCE_URL=http://evidence-service:8080
      - PORT=8080
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-log}
      - EMAIL_API_KEY=${EMAIL_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - WEB_BASE_URL=${WEB_BASE_URL:-http://localhost:4200}
    depends_on:
      - auth-service
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro

  evidence-service:
    profiles: [micro]
    build:
      context: ./microservicios
      dockerfile: evidence-service/Dockerfile
    container_name: alerta-mujer-evidence
    ports:
      - "8083:8080"
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-alerta_mujer}
      - POSTGRES_USER=alerta_app
      - POSTGRES_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Define APP_DB_PASSWORD en el archivo .env}
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en el archivo .env (aleatorio, 32+ caracteres)}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:*,http://127.0.0.1:*}
      - FIREBASE_CONFIG_PATH=/app/firebase-service-account.json
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-clave-interna-solo-local}
      - SERVICES_AUTH_URL=http://auth-service:8080
      - SERVICES_ALERT_URL=http://alert-service:8080
      - SERVICES_EVIDENCE_URL=http://evidence-service:8080
      - PORT=8080
      - EVIDENCE_STORAGE=${EVIDENCE_STORAGE:-s3}
      - EVIDENCE_S3_ENDPOINT=${EVIDENCE_S3_ENDPOINT:-http://s3:8333}
      - EVIDENCE_S3_PUBLIC_ENDPOINT=${EVIDENCE_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - EVIDENCE_S3_REGION=${EVIDENCE_S3_REGION:-us-east-1}
      - EVIDENCE_S3_BUCKET=${EVIDENCE_S3_BUCKET:-alerta-mujer-evidencias}
      - EVIDENCE_S3_ACCESS_KEY=${EVIDENCE_S3_ACCESS_KEY:-alerta_s3_local}
      - EVIDENCE_S3_SECRET_KEY=${EVIDENCE_S3_SECRET_KEY:-alerta_s3_local_secret}
      - EVIDENCE_S3_CREATE_BUCKET=true
    depends_on:
      s3:
        condition: service_healthy
    volumes:
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro

volumes:
  postgres_data:
  evidence_data:
  s3_data:
