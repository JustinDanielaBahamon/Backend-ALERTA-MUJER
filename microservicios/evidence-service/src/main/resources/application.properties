spring.application.name=evidence-service
server.port=${PORT:8083}
server.address=0.0.0.0
# IP real del cliente detrás del proxy (Render): Tomcat lee X-Forwarded-For solo si viene de un proxy interno
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

# Runtime Database Configuration (alerta_app - DML only)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alerta_mujer}}
spring.datasource.username=${POSTGRES_USER:alerta_app}
spring.datasource.password=${POSTGRES_PASSWORD:tu_password_alerta_app}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration (alerta_admin - DDL + DML)
# Las migraciones de la base compartida las aplica Auth Service
spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:dev}
spring.liquibase.user=${LIQUIBASE_USER:alerta_admin}
spring.liquibase.password=${LIQUIBASE_PASSWORD:tu_password_alerta_admin}
# Contraseña del usuario de runtime alerta_app (la fija el changeset v1.1.0-app-role-password)
spring.liquibase.parameters.app_db_password=${APP_DB_PASSWORD:}

# JWT Configuration
# Obligatorio y sin valor por defecto (ver JwtKeyProvider)
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRES_IN:86400000}

# CORS: orígenes del panel web autorizados (separados por coma, admiten *). La app móvil no envía Origin.
cors.allowed-origins=${CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*,https://alerta-mujer*.vercel.app}

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Evidencias: los archivos se guardan en disco (volumen Docker), nunca en una carpeta pública
# Dónde se guardan los archivos: disk (desarrollo) o s3 (Backblaze B2 en producción, MinIO en local)
evidence.storage=${EVIDENCE_STORAGE:disk}
evidence.storage-dir=${EVIDENCE_STORAGE_DIR:./data/evidence}
evidence.s3.endpoint=${EVIDENCE_S3_ENDPOINT:}
evidence.s3.region=${EVIDENCE_S3_REGION:us-east-005}
evidence.s3.bucket=${EVIDENCE_S3_BUCKET:}
evidence.s3.access-key=${EVIDENCE_S3_ACCESS_KEY:}
evidence.s3.secret-key=${EVIDENCE_S3_SECRET_KEY:}
evidence.s3.create-bucket=${EVIDENCE_S3_CREATE_BUCKET:false}
# Endpoint para los enlaces firmados que abre el navegador (vacío = el mismo endpoint)
evidence.s3.public-endpoint=${EVIDENCE_S3_PUBLIC_ENDPOINT:}
evidence.max-size-bytes=${EVIDENCE_MAX_SIZE_BYTES:52428800}
spring.servlet.multipart.max-file-size=${EVIDENCE_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${EVIDENCE_MAX_REQUEST_SIZE:55MB}

# Inicio de sesión con Google: Client IDs de OAuth aceptados para tokens de Google (app móvil).
# Los tokens de Firebase (web) se validan con la cuenta de servicio de Firebase.
# Cliente web del proyecto de Firebase (lo usa el inicio de sesión nativo de la app) y los anteriores
google.client-ids=${GOOGLE_CLIENT_IDS:656563018279-blo6edqva74tbsdce0mau3n6rv007fvi.apps.googleusercontent.com,266164512214-a48icf7ct4140gor9pq64iq04ebvp4ta.apps.googleusercontent.com,266164512214-u4jqsko28es0lns9ubpes0vrnr3hgjqv.apps.googleusercontent.com}

# Notificaciones de alertas a los contactos (correo con enlace de seguimiento)
# Proveedor: resend | brevo | log (log = no envía, solo registra). Render gratis bloquea SMTP.
notifications.email.provider=${EMAIL_PROVIDER:log}
notifications.email.api-key=${EMAIL_API_KEY:}
notifications.email.from=${EMAIL_FROM:}
# Dirección de la web donde está la página /seguimiento/{codigo}
notifications.web-base-url=${WEB_BASE_URL:http://localhost:4200}

# ── Microservicios ──────────────────────────────────────────────
# Dirección de cada servicio (en Render, la URL pública de cada uno)
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8081}
services.alert.url=${SERVICES_ALERT_URL:http://localhost:8082}
services.evidence.url=${SERVICES_EVIDENCE_URL:http://localhost:8083}
# Clave compartida para las llamadas /internal/** entre servicios (la misma en los tres)
internal.api-key=${INTERNAL_API_KEY:}
