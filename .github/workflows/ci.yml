# Builds and tests the three microservices on every push and pull request.
name: CI

on:
  push:
    branches: [develop, qa, main, feature/audit-cleanup-google-signin]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservicios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tests (shared-kernel, auth, alert, evidence)
        run: mvn -B -ntp test
