# Blueprint de Render: backend (Docker) + PostgreSQL, ambos en el plan gratis.
# Pasos y variables: ver DEPLOY_RENDER.md.
services:
  - type: web
    name: alerta-mujer-backend
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend-monolith
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Conexión a la base (Render entrega host, puerto, nombre, usuario y contraseña por separado)
      - key: DB_HOST
        fromDatabase:
          name: alerta-mujer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alerta-mujer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: alerta-mujer-db
          property: database
      # Liquibase migra con el usuario dueño de la base...
      - key: LIQUIBASE_USER
        fromDatabase:
          name: alerta-mujer-db
          property: user
      - key: LIQUIBASE_PASSWORD
        fromDatabase:
          name: alerta-mujer-db
          property: password
      # ...y el backend se conecta con alerta_app, que solo puede leer y escribir datos.
      # Liquibase crea ese rol con APP_DB_PASSWORD; POSTGRES_PASSWORD la reutiliza (Spring
      # resuelve el ${...}).
      - key: POSTGRES_USER
        value: alerta_app
      - key: APP_DB_PASSWORD
        generateValue: true
      - key: POSTGRES_PASSWORD
        value: ${APP_DB_PASSWORD}
      # Solo roles y configuración base: sin cuentas de prueba con contraseñas conocidas
      - key: LIQUIBASE_CONTEXTS
        value: prod
      - key: JWT_SECRET
        generateValue: true
      # Dominio del panel web (Vercel); agrega aquí el dominio propio cuando exista
      - key: CORS_ORIGIN
        value: "https://alerta-mujer*.vercel.app"
      # Correos a los contactos de emergencia (Resend o Brevo). La clave se escribe a mano en el
      # dashboard; EMAIL_FROM debe ser de un dominio verificado en el proveedor.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Panel web donde los contactos abren el enlace de seguimiento
      - key: WEB_BASE_URL
        value: https://alerta-mujer.vercel.app
      # Archivo de cuenta de servicio de Firebase: se sube como Secret File en el dashboard
      - key: FIREBASE_CONFIG_PATH
        value: /etc/secrets/firebase-service-account.json
      # El disco del plan gratis se borra en cada despliegue o reinicio
      - key: EVIDENCE_STORAGE_DIR
        value: /tmp/evidence
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never
      # La instancia gratis tiene 512 MB
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k

  # ── alerta-mujer-auth (microservicio) ─────────────────────────────────────
  - type: web
    name: alerta-mujer-auth
    runtime: docker
    plan: free
    region: virginia
    rootDir: microservicios
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: alerta-mujer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alerta-mujer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: alerta-mujer-db
          property: database
      - key: POSTGRES_USER
        value: alerta_app
      - key: APP_DB_PASSWORD
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: APP_DB_PASSWORD
      - key: JWT_SECRET
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: JWT_SECRET
      - fromGroup: alerta-mujer-microservicios
      - key: POSTGRES_PASSWORD
        value: ${APP_DB_PASSWORD}
      - key: SERVICES_AUTH_URL
        value: https://alerta-mujer-auth.onrender.com
      - key: SERVICES_ALERT_URL
        value: https://alerta-mujer-alert.onrender.com
      - key: SERVICES_EVIDENCE_URL
        value: https://alerta-mujer-evidence.onrender.com
      # Solo Auth aplica las migraciones de la base compartida
      - key: LIQUIBASE_USER
        fromDatabase:
          name: alerta-mujer-db
          property: user
      - key: LIQUIBASE_PASSWORD
        fromDatabase:
          name: alerta-mujer-db
          property: password
      - key: LIQUIBASE_CONTEXTS
        value: prod
      - key: FIREBASE_CONFIG_PATH
        value: /etc/secrets/firebase-service-account.json
  # ── alerta-mujer-alert (microservicio) ─────────────────────────────────────
  - type: web
    name: alerta-mujer-alert
    runtime: docker
    plan: free
    region: virginia
    rootDir: microservicios
    dockerfilePath: ./alert-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: alerta-mujer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alerta-mujer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: alerta-mujer-db
          property: database
      - key: POSTGRES_USER
        value: alerta_app
      - key: APP_DB_PASSWORD
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: APP_DB_PASSWORD
      - key: JWT_SECRET
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: JWT_SECRET
      - fromGroup: alerta-mujer-microservicios
      - key: POSTGRES_PASSWORD
        value: ${APP_DB_PASSWORD}
      - key: SERVICES_AUTH_URL
        value: https://alerta-mujer-auth.onrender.com
      - key: SERVICES_ALERT_URL
        value: https://alerta-mujer-alert.onrender.com
      - key: SERVICES_EVIDENCE_URL
        value: https://alerta-mujer-evidence.onrender.com
      # Correos (avisos a contactos y códigos de recuperación) por la API de Resend, desde el
      # dominio verificado alertamujer.me. La clave se escribe a mano en el dashboard de este servicio.
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "AlertaMujer <alertas@alertamujer.me>"
      - key: WEB_BASE_URL
        value: https://alerta-mujer.vercel.app
      - key: FIREBASE_CONFIG_PATH
        value: /etc/secrets/firebase-service-account.json
  # ── alerta-mujer-evidence (microservicio) ─────────────────────────────────────
  - type: web
    name: alerta-mujer-evidence
    runtime: docker
    plan: free
    region: virginia
    rootDir: microservicios
    dockerfilePath: ./evidence-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: alerta-mujer-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: alerta-mujer-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: alerta-mujer-db
          property: database
      - key: POSTGRES_USER
        value: alerta_app
      - key: APP_DB_PASSWORD
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: APP_DB_PASSWORD
      - key: JWT_SECRET
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: JWT_SECRET
      - fromGroup: alerta-mujer-microservicios
      - key: POSTGRES_PASSWORD
        value: ${APP_DB_PASSWORD}
      - key: SERVICES_AUTH_URL
        value: https://alerta-mujer-auth.onrender.com
      - key: SERVICES_ALERT_URL
        value: https://alerta-mujer-alert.onrender.com
      - key: SERVICES_EVIDENCE_URL
        value: https://alerta-mujer-evidence.onrender.com
      - key: EVIDENCE_STORAGE
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_STORAGE
      - key: EVIDENCE_S3_ENDPOINT
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_S3_ENDPOINT
      - key: EVIDENCE_S3_REGION
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_S3_REGION
      - key: EVIDENCE_S3_BUCKET
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_S3_BUCKET
      - key: EVIDENCE_S3_ACCESS_KEY
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_S3_ACCESS_KEY
      - key: EVIDENCE_S3_SECRET_KEY
        fromService:
          name: alerta-mujer-backend
          type: web
          envVarKey: EVIDENCE_S3_SECRET_KEY
      - key: EVIDENCE_STORAGE_DIR
        value: /tmp/evidence

envVarGroups:
  # Comunes a los 3 microservicios
  - name: alerta-mujer-microservicios
    envVars:
      # Clave de las llamadas /internal/** entre servicios (Render la genera)
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://alerta-mujer*.vercel.app"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: never

databases:
  - name: alerta-mujer-db
    plan: free
    region: virginia
    databaseName: alerta_mujer
    postgresMajorVersion: "16"
    user: alerta_admin
