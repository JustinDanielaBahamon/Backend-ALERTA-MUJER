databaseChangeLog:
  - changeSet:
      id: create-new-admin-user
      author: alerta-mujer-team
      context: prod
      preConditions:
        - onFail: MARK_RAN
          sqlCheck:
            expectedResult: "0"
            sql: SELECT COUNT(*) FROM identity.users WHERE email = 'nuevoadmin@test.com'
      changes:
        - sql:
            sql: |
              -- Crear nuevo usuario administrador
              INSERT INTO identity.users (role_id, first_name, last_name, telephone, email, document_number, document_type, birthdate, created_at) 
              VALUES (2, 'Nuevo', 'Admin', '+57 320 000 0011', 'nuevoadmin@test.com', NULL, NULL, NULL, NOW());
              
              -- Obtener el ID del usuario recién creado
              WITH new_user AS (
                SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com'
              )
              -- Crear cuenta con contraseña hasheada: Admin2024!
              INSERT INTO identity.account (user_id, password_hash, status, last_access)
              SELECT id, '$2a$10$rZ6qJYzQX9EZDfGvK5HY4.KmVBZK2pXJ8YqZGqN5YWKPzL5JsXw9u', 'active', NULL
              FROM new_user;
              
              -- Crear perfil de usuario
              WITH new_user AS (
                SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com'
              )
              INSERT INTO identity.user_profile (user_id, profile_photo_url, tutorial_completed, tutorial_seen_at, created_at, updated_at)
              SELECT id, NULL, TRUE, NOW(), NOW(), NULL
              FROM new_user;
              
              -- Crear perfil de administrador
              WITH new_user AS (
                SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com'
              )
              INSERT INTO identity.admin_profile (user_id, admin_level, permissions, created_at, updated_at)
              SELECT id, 'super_admin', '["all"]'::jsonb, NOW(), NULL
              FROM new_user;
      rollback:
        - sql:
            sql: |
              DELETE FROM identity.admin_profile WHERE user_id IN (SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com');
              DELETE FROM identity.user_profile WHERE user_id IN (SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com');
              DELETE FROM identity.account WHERE user_id IN (SELECT id FROM identity.users WHERE email = 'nuevoadmin@test.com');
              DELETE FROM identity.users WHERE email = 'nuevoadmin@test.com';
