databaseChangeLog:
  - changeSet:
      id: create-audit-log-table
      author: alerta-mujer-team
      changes:
        - createTable:
            schemaName: admin
            tableName: audit_log
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_audit_log_account
                    references: identity.account(id)
                    onDelete: CASCADE
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: INTEGER
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: admin
            tableName: audit_log

  - changeSet:
      id: create-user-report-table
      author: alerta-mujer-team
      changes:
        - createTable:
            schemaName: admin
            tableName: user_report
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: reported_user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_report_reported_user
                    references: identity.users(id)
                    onDelete: CASCADE
              - column:
                  name: reporter_user_id
                  type: INTEGER
                  constraints:
                    foreignKeyName: fk_user_report_reporter_user
                    references: identity.users(id)
                    onDelete: SET NULL
              - column:
                  name: reason
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'pending'
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_by_admin_id
                  type: INTEGER
              - column:
                  name: reviewed_at
                  type: TIMESTAMP
              - column:
                  name: resolution_notes
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            schemaName: admin
            tableName: user_report

  - changeSet:
      id: create-moderation-action-table
      author: alerta-mujer-team
      changes:
        - createTable:
            schemaName: admin
            tableName: moderation_action
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: user_report_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_moderation_action_user_report
                    references: admin.user_report(id)
                    onDelete: CASCADE
              - column:
                  name: admin_perfil_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: action_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            schemaName: admin
            tableName: moderation_action

  - changeSet:
      id: create-system-configuration-table
      author: alerta-mujer-team
      changes:
        - createTable:
            schemaName: admin
            tableName: system_configuration
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: singleton_key
                  type: VARCHAR(10)
                  defaultValue: 'SYSTEM'
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: sos_max_duration_minutes
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: emergency_phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: admin_email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: notifications_enabled
                  type: BOOLEAN
                  defaultValue: true
                  constraints:
                    nullable: false
              - column:
                  name: default_notification_priority
                  type: VARCHAR(20)
                  defaultValue: 'normal'
                  constraints:
                    nullable: false
              - column:
                  name: default_theme
                  type: VARCHAR(20)
                  defaultValue: 'light'
                  constraints:
                    nullable: false
              - column:
                  name: updated_by_admin_id
                  type: INTEGER
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
      rollback:
        - dropTable:
            schemaName: admin
            tableName: system_configuration
