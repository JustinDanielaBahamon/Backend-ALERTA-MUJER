spring.application.name=alerta-mujer-backend
server.port=8080
server.address=0.0.0.0

# Runtime Database Configuration (alerta_app - DML only)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/alerta_mujer}
spring.datasource.username=${POSTGRES_USER:alerta_app}
spring.datasource.password=${POSTGRES_PASSWORD:tu_password_alerta_app}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase Configuration (alerta_admin - DDL + DML)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:dev}
spring.liquibase.user=${LIQUIBASE_USER:alerta_admin}
spring.liquibase.password=${LIQUIBASE_PASSWORD:tu_password_alerta_admin}
# Contraseña del usuario de runtime alerta_app (la fija el changeset v1.1.0-app-role-password)
spring.liquibase.parameters.app_db_password=${APP_DB_PASSWORD:}

# JWT Configuration
jwt.secret=${JWT_SECRET:alerta_mujer_jwt_secret_key_2026_xK9mP2qR5sT8uV1wX4yZ7}
jwt.expiration=${JWT_EXPIRES_IN:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGIN:*}

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
